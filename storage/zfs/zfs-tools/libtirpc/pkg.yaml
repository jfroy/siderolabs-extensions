
name: libtirpc-zfs
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://src.fedoraproject.org/lookaside/extras/libtirpc/libtirpc-{{ .LIBTIRPC_VERSION | replace "-" "." }}.tar.bz2/sha512/f3ccc45f9de8d517ccc10dd4b68b844bbe71a2cb61ca5819995d97319353f7e24cfee205e09dddf65cf47605314176aee161091d7379b6113ee8d1f5077c93d0/libtirpc-{{ .LIBTIRPC_VERSION | replace "-" "." }}.tar.bz2
        destination: libtirpc.tar.bz2
        sha256: bbd26a8f0df5690a62a47f6aa30f797f3ef8d02560d1bc449a83066b5a1d3508
        sha512: f3ccc45f9de8d517ccc10dd4b68b844bbe71a2cb61ca5819995d97319353f7e24cfee205e09dddf65cf47605314176aee161091d7379b6113ee8d1f5077c93d0
        # ref: https://git.alpinelinux.org/aports/tree/main/libc-dev
        # https://wiki.musl-libc.org/faq.html#Q:-Why-is-%3Ccode%3Esys/queue.h%3C/code%3E-not-included
      - url: https://gitlab.alpinelinux.org/alpine/aports/-/raw/master/main/bsd-compat-headers/queue.h?ref_type=heads&inline=false
        sha256: c13407edd0e33be73cae72514cb234f8612e1c0e54401c9448daffd3a240158b
        sha512: 2f0d5e6e4dc3350285cf17009265dddcbe12431c111868eea39bc8cb038ab7c1f2acacbb21735c4e9d4a1fd106a8fc0f8611ea33987d4faba37dde5ce6da0750
        destination: sys-queue.h
    prepare:
      - |
        tar -xf libtirpc.tar.bz2 --strip-components=1

        mkdir -p /usr/local/include/sys
        cp sys-queue.h /usr/local/include/sys/queue.h

        export CFLAGS="${CFLAGS} -I/usr/local/include"

        ./configure \
          --prefix=/usr/local \
          --disable-gssapi
    build:
      - |
        make -j $(nproc)
    install:
      - |
        mkdir -p /rootfs

        make install DESTDIR=/rootfs
        rm -rf /rootfs/usr/local/share/man
finalize:
  - from: /rootfs
    to: /rootfs
